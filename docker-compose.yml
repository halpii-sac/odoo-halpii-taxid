# Local test environment (not part of the module). Usage:
#   ODOO_VERSION=17 docker compose up -d      # or 18
#   docker compose down -v                    # frees memory and the database
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
  odoo:
    image: odoo:${ODOO_VERSION:-17}
    depends_on: [db]
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      TAXID_TEST_KEY: ${TAXID_TEST_KEY:-}
    volumes:
      - ./:/mnt/extra-addons:ro
      - odoo-data:/var/lib/odoo
volumes:
  db-data:
  odoo-data:
